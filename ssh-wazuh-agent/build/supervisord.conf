[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:sshd]
command=/usr/sbin/sshd -D
autorestart=true
priority=10
stopasgroup=true
killasgroup=true

[program:rsyslog]
command=/usr/sbin/rsyslogd -n
autorestart=true
priority=20
stopasgroup=true
killasgroup=true

[program:wazuh-agent]
command=/bin/bash -lc "/var/ossec/bin/wazuh-control start; exec tail -F /var/ossec/logs/ossec.log"
startsecs=8
autorestart=true
priority=30
redirect_stderr=true
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/wazuh-agent.out.log
stderr_logfile=/var/log/supervisor/wazuh-agent.err.log
