services:
  ssh_wazuh_agent:
    container_name: ssh_wazuh_agent
    build:
      context: ./build
    image: ssh-docker-ssh-wazuh-agent:4.13.1
    restart: unless-stopped
    ports:
      - "6392:22"
    environment:
      # ajuste conforme necessário
      WAZUH_MANAGER: "10.1.3.191"
      WAZUH_AGENT_NAME: "vm2-ssh-agent"
      # se você usa authd com senha no manager, preencha; senão, deixe vazio
      WAZUH_ENROLLMENT_PASSWORD: ""
      SSH_USER: "admin"
      SSH_PASSWORD: "SecretPassword"
      TZ: "America/Sao_Paulo"
    volumes:
      # Persistência do SSH (config) e logs
      - ssh_etc:/etc/ssh
      - ssh_logs:/var/log
      # Persistência do agente Wazuh
      - wazuh_data:/var/ossec
    # Para facilitar troubleshooting
    tty: true

volumes:
  ssh_etc:
  ssh_logs:
  wazuh_data:
